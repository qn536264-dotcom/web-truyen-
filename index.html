<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Truyện</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #ff4757;
        }
        .comic-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin: 20px auto;
            padding: 0;
            list-style: none;
        }
        .comic-card {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            border: 1px solid #333;
        }
        .comic-card a {
            color: #70a1ff;
            text-decoration: none;
            font-size: 18px;
        }
        .comic-card a:hover {
            color: #ff4757;
        }
        .comic-card p {
            font-size: 13px;
            color: #aaa;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <h1>Danh Sách Truyện Tranh</h1>

    <ul class="comic-list">
        <li class="comic-card">
            <a href="truyen-1.html"><strong>Tên Bộ Truyện 1</strong></a>
            <p>Mô tả ngắn về bộ truyện 1...</p>
        </li>
    </ul>

</body>
</html>
